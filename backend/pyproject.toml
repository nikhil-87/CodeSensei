[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codesensei-backend"
version = "0.1.0"
description = "FastAPI backend for CodeSensei - AI-powered code intelligence platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # Web framework
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.9",
    "sse-starlette==2.1.3",

    # Validation / settings
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",

    # Authentication (GitHub OAuth + JWT cookie sessions)
    "PyJWT==2.9.0",
    # Database (async)
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "alembic==1.13.3",

    # Queue / cache
    "redis==5.0.8",
    "rq==1.16.2",

    # AI / vector
    "chromadb==0.5.5",
    "httpx==0.27.2",

    # Logging / observability
    "structlog==24.4.0",
    "prometheus-client==0.21.0",
    "opentelemetry-api==1.27.0",
    "opentelemetry-sdk==1.27.0",
    "opentelemetry-instrumentation-fastapi==0.48b0",

    # Utilities
    "tenacity==9.0.0",
    "python-slugify==8.0.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "httpx==0.27.2",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "import-linter==2.1",
    "factory-boy==3.3.1",
    "hypothesis==6.112.1",
    "fakeredis==2.24.1",
    "aiosqlite==0.20.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplifications
    "RUF",           # ruff-specific
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # asserts allowed in tests

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rq.*", "chromadb.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning"]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "alembic/*"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70

# ---------------------------------------------------------------------------
# Import-linter — Clean Architecture contracts
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Layered architecture: api → services → repositories → models"
type = "layers"
layers = [
    "app.api",
    "app.services",
    "app.repositories",
    "app.models",
]
ignore_imports = [
    # services may use schemas freely; schemas are DTOs, not a layer
    "app.services.* -> app.schemas.*",
    "app.api.* -> app.schemas.*",
    "app.repositories.* -> app.db.*",
]
