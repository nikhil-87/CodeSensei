# ============================================================================
# Base compose file — production-shaped service definitions.
# Override with docker-compose.dev.yml for hot reload during development.
# ============================================================================

name: codesensei

networks:
  internal:
    driver: bridge
  observability:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  chroma-data:
  ollama-data:
  workspaces:

services:
  # ---------------------------------------------------------------------------
  # Stateful services
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis-data:/data
      - ../infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

  chroma:
    image: chromadb/chroma:0.5.5
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma-data:/chroma/chroma
    ports:
      - "${CHROMA_PORT:-8000}:8000"
    healthcheck:
      # The chroma image is python-slim and ships neither curl nor wget,
      # so we use the bundled python interpreter to probe heartbeat.
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              r = urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat', timeout=3)
              sys.exit(0 if r.status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal]

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks: [internal]

  # ---------------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      chroma:   { condition: service_healthy }
      ollama:   { condition: service_started }
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - workspaces:/var/lib/codesensei/workspaces
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal, observability]

  worker:
    build:
      # Worker build needs both analysis-engine/ and worker/ in scope, so
      # the build context is the repo root and we point at the dockerfile
      # explicitly.
      context: ..
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      chroma:   { condition: service_healthy }
      ollama:   { condition: service_started }
    volumes:
      - workspaces:/var/lib/codesensei/workspaces
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    networks: [internal, observability]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    ports:
      # nginx inside the container listens on 8080 (non-root user can't bind 80).
      - "${FRONTEND_PORT:-5173}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [internal]
