server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Long-lived caching for fingerprinted assets, no-cache for index.
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Reverse-proxy the API to the backend container in compose.
    location /api/ {
        # Resolve the backend hostname dynamically via Docker's embedded DNS
        # (127.0.0.11) so a recreated backend container with a new IP doesn't
        # leave nginx stuck on a stale address (which manifests as 502s).
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $api_backend backend;
        proxy_pass         http://$api_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE: disable buffering, allow long streaming responses.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1h;
    }

    # SPA fallback — serve index.html for any unknown route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tighten security headers a bit.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Content-Security-Policy: restrict where resources may load from. Scripts
    # are same-origin only; styles allow inline (Tailwind + mermaid inject some);
    # images allow GitHub avatars + inline SVG data URIs; XHR/SSE to same origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.githubusercontent.com; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    error_page   500 502 503 504  /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}
