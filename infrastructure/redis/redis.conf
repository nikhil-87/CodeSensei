# ============================================================================
# Redis production-ish config.
# Tuned for a single-instance dev/staging deployment that backs both the
# RQ queue and the FastAPI cache. Production multi-tenant deployments
# should override this with their own managed-Redis configuration.
# ============================================================================

# --- Networking --------------------------------------------------------------
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# --- General -----------------------------------------------------------------
daemonize no
loglevel notice
databases 16
always-show-logo no

# --- Persistence -------------------------------------------------------------
# RDB snapshots — survives crashes; cache hit-rate restored after restart.
save 900 1
save 300 10
save 60  10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF off by default — RDB is enough for cache + queue, and AOF doubles disk I/O.
appendonly no

# --- Memory policy -----------------------------------------------------------
# Cap memory and use LRU eviction so the cache never starves the queue.
maxmemory 512mb
maxmemory-policy allkeys-lru

# --- Slow-log ----------------------------------------------------------------
slowlog-log-slower-than 50000
slowlog-max-len 128

# --- Latency tracking --------------------------------------------------------
latency-monitor-threshold 100
