# Production Nginx Configuration
#
# Usage:
#   1. Place this file at infrastructure/nginx/prod.conf
#   2. Install TLS certificate (see below)
#   3. Update SERVER_NAME and certificate paths
#   4. Add nginx service to docker-compose.prod.yml (see docs/Deployment-Guide.md)
#   5. Restart: docker compose up -d
#
# TLS Setup:
#   sudo apt-get install certbot
#   sudo certbot certonly --standalone -d yourdomain.com
#   Cert will be at: /etc/letsencrypt/live/yourdomain.com/fullchain.pem
#   Key will be at:  /etc/letsencrypt/live/yourdomain.com/privkey.pem
#   
# Auto-renew:
#   sudo certbot renew --dry-run
#   sudo systemctl enable certbot-renew.timer

upstream backend {
    server backend:8000;
    keepalive 32;
}

upstream frontend {
    server frontend:5173;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=public:10m rate=2r/s;

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS with TLS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # === TLS Configuration ===
    # Update these paths to match your certificate location
    ssl_certificate           /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key       /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    ssl_trusted_certificate   /etc/letsencrypt/live/yourdomain.com/chain.pem;

    # === Security Headers ===
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # === Logging ===
    access_log /var/log/nginx/codesensei.access.log combined buffer=32k flush=1s;
    error_log /var/log/nginx/codesensei.error.log warn;

    # === Gzip Compression ===
    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml+rss;
    gzip_min_length 1024;
    gzip_vary on;

    # === Frontend (React SPA) ===
    location / {
        limit_req zone=public burst=5 nodelay;

        proxy_pass http://frontend;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        # SPA routing: send 404s to index.html
        error_page 404 =200 /index.html;

        # Caching: static assets long-lived, HTML short-lived
        location ~* \.(js|css|svg|png|jpg|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location = /index.html {
            expires 5m;
            add_header Cache-Control "public, must-revalidate";
        }
    }

    # === Backend API ===
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        # SSE streams (analysis progress)
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;

        # Keep-alive
        proxy_set_header Connection "upgrade";
    }

    # === Health checks (internal only) ===
    location = /health {
        access_log off;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # === Metrics endpoint (internal only) ===
    location /metrics {
        access_log off;

        # Restrict to private networks
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # === Deny admin paths ===
    location ~ /admin {
        deny all;
    }
    location ~ /grafana {
        deny all;
    }

    # === Redirect www to non-www (optional) ===
    if ($host = www.yourdomain.com) {
        return 301 https://yourdomain.com$request_uri;
    }
}

# Prometheus / Grafana (internal only)
server {
    listen 9090;
    listen 3000;
    server_name _;

    # Allow from private networks only
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    location / {
        return 404;
    }
}
