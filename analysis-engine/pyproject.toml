[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "codesensei-engine"
version = "0.1.0"
description = "Pure-Python code-analysis engine: parsers, dependency graphs, complexity, dead code, architecture discovery."
requires-python = ">=3.12"
authors = [{ name = "Nikhil Kumar Shah" }]
license = { text = "Apache-2.0" }
readme = "README.md"

dependencies = [
    "structlog==24.4.0",
    "tree-sitter==0.23.2",
    "tree-sitter-languages==1.10.2",
    "GitPython==3.1.43",
    "chardet==5.2.0",
    "pathspec==0.12.1",
    "httpx==0.27.2",
    "chromadb==0.5.5",
    "tenacity==9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.24.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "types-chardet==5.0.4.6",
]

[tool.hatch.build.targets.wheel]
packages = ["engine"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "C4", "UP", "SIM", "RUF", "PT", "TID", "S",
]
ignore = [
    "S101",   # asserts ok in tests
    "S603",   # subprocess: we use it for git, with vetted args
    "S607",   # partial exec path: ditto
]
[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S", "PLR2004"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
plugins = []

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["engine"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 75
